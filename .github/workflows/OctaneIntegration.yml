name: Octane Integration

on:
  pull_request:
    types: [opened, edited, closed, reopened]
  workflow_run:
    workflows: [Tests]
    types: [requested, in_progress, completed]

env:
  NODE_TLS_REJECT_UNAUTHORIZED: 0

jobs:
  octane_integration_job:
    runs-on: ubuntu-latest
    name: OctaneIntegration#${{github.event.action}}#${{github.event.workflow_run.id}}
    steps:

      # ✅ Télécharger les paramètres du workflow Tests
      - name: Download environment params
        if: github.event.workflow_run.conclusion != null
        uses: actions/download-artifact@v4
        with:
          name: octane-params
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      # ✅ Lire et exporter la valeur
      - name: Read environment param
        id: read_env
        run: |
          if [ -f "params.properties" ]; then
            ENV_VALUE=$(grep 'environment=' params.properties | cut -d'=' -f2)
            echo "environment=${ENV_VALUE}" >> $GITHUB_OUTPUT
          else
            echo "environment=preprod" >> $GITHUB_OUTPUT
          fi

      - name: GitHub Actions ALM Octane Integration
        uses: MicroFocus/alm-octane-github-actions-integration@v25.2.1
        id: gitHubActionsIntegration
        with:
          octaneUrl: 'https://almoctane-eur.saas.microfocus.com'
          octaneSharedSpace: 648009
          octaneWorkspace: 1002
          octaneClientId: ${{secrets.ALM_OCTANE_CLIENT_ID}}
          octaneClientSecret: ${{secrets.ALM_OCTANE_CLIENT_SECRET}}
          githubToken: ${{secrets.GITHUB_TOKEN}}
          serverBaseUrl: https://github.com/GuermeziAmine/KarateProject
          # ✅ Passer l'environment comme paramètre
          pipelineNamePattern: '${workflow_name}'
          unitTestResultsGlobPattern: "**/*.xml"
          parameters: 'environment=${{ steps.read_env.outputs.environment }}'