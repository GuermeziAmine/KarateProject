name: Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        options:
          - preprod
          - staging
          - dev
        required: true
        default: 'preprod'

jobs:
  
  build:
    name: "Test - ${{ github.event.inputs.environment || 'preprod' }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du coder
        uses: actions/checkout@v4


      - name: Configuration du JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Log workflow inputs for Octane
        run: |
          echo "description::Environnement: ${{ github.event.inputs.environment || 'preprod' }}"

      - name: Start Checksum Node Server
        run: |
          cd checksum
          npm install
          node index.js &
          sleep 5

      - name: Run Karate Tests
        if: always()
        run: |
          TARGET_ENV="${{ github.event.inputs.environment || 'preprod' }}"
          mvn test -Dkarate.env=$TARGET_ENV "-Dkarate.options=classpath:Practice"

      
      - name: Convert durations
        if: always()
        run: |
          sed -i -E 's/time="([0-9]+)\.([0-9]+)"/time="\1\2"/g' target/surefire-reports/*.xml


      - name: Cache JMeter
        if: always()      
        id: cache-jmeter
        uses: actions/cache@v3
        with:
          path: jmeter
          key: jmeter-5.6.3

      - name: Install JMeter 5.6.3
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter
          rm apache-jmeter-5.6.3.tgz

      - name: Configuration de Python
        if: always()      
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installation de Taurus (bzt)
        if: always()
        run: |
          pip install bzt
          pip install urwid==2.1.2

      - name: 1. Exécution Hybride (Taurus -> Octane & Power BI)
        if: always()
        run: |
          # --- PRÉPARATION ---
          BASE_DIR="$PWD"
          OUTPUT_DIR="$BASE_DIR/results_powerbi"
          mkdir -p "$OUTPUT_DIR"
          
          echo "📂 Dossier cible final : $OUTPUT_DIR"

          # Configuration Taurus (Standard)
          cat <<EOF > octane_config.yml
          modules:
            jmeter:
              path: $BASE_DIR/jmeter/bin/jmeter
          reporting:
          - module: junit-xml
            filename: report_octane.xml
            data-source: sample-labels
            sample-labels: true
          settings:
            check-updates: false
            default-executor: jmeter
          EOF

          # --- EXÉCUTION ---
          for file in src/test/jmeter/*.jmx; do
            echo "🚀 Lancement de $file..."
            FILENAME=$(basename "$file" .jmx)
            
            # 1. On définit un dossier temporaire UNIQUE pour ce test
            TEMP_ARTIFACT_DIR="artifacts_$FILENAME"
            
            # 2. On lance Taurus en lui disant : "Mets tout dans ce dossier temporaire" (-d)
            bzt "$file" octane_config.yml -q -d "$TEMP_ARTIFACT_DIR"

            # 3. LA RÉCUPÉRATION (C'est ici que ça change)
            # Taurus génère toujours un fichier 'kpi.jtl' (c'est un CSV) dans son dossier d'artefacts.
            # On le prend et on le copie là où on veut.
            if [ -f "$TEMP_ARTIFACT_DIR/kpi.jtl" ]; then
                echo "✅ Résultats trouvés pour $FILENAME. Copie en cours..."
                cp "$TEMP_ARTIFACT_DIR/kpi.jtl" "$OUTPUT_DIR/${FILENAME}.csv"
            else
                echo "❌ ATTENTION : Pas de fichier kpi.jtl généré pour $FILENAME"
            fi

            # Gestion Octane (Récupération du XML dans le même dossier temporaire)
            if [ -f "$TEMP_ARTIFACT_DIR/report_octane.xml" ]; then
                sed -i -E "s/classname=\"bzt-[0-9]+\"/classname=\"$FILENAME\"/g" "$TEMP_ARTIFACT_DIR/report_octane.xml"
                mv "$TEMP_ARTIFACT_DIR/report_octane.xml" "report_${FILENAME}.xml"
            fi
          done
          
          # Preuve de vie finale
          echo "🔍 Contenu final du dossier results_powerbi :"
          ls -lh "$OUTPUT_DIR"


      - name: 3. Mise à jour de l'Historique (Mode Append)
        if: always()
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Chemins
          mkdir -p history
          HISTORY_FILE="history/global_perf_history.csv"
          NEW_DATA="final_results/resultats_global.csv"
          
          # --- SÉCURITÉ : On vérifie si le fichier existe avant de toucher ---
          if [ -f "$NEW_DATA" ]; then
            echo "✅ Nouvelles données détectées. Traitement en cours..."
            
            # Ajouter le Run ID
            sed -i "s/$/,$GITHUB_RUN_NUMBER/" "$NEW_DATA"
            
            # Logique d'ajout
            if [ ! -f "$HISTORY_FILE" ]; then
                echo "Création du fichier historique..."
                sed "1s/$GITHUB_RUN_NUMBER/RunID/" "$NEW_DATA" > "$HISTORY_FILE"
            else
                echo "Ajout au fichier existant..."
                tail -n +2 "$NEW_DATA" >> "$HISTORY_FILE"
            fi

            # Commit
            git add "$HISTORY_FILE"
            git diff --quiet && git diff --staged --quiet || (git commit -m "Append Run $GITHUB_RUN_NUMBER to History [skip ci]" && git push)
          
          else
            echo "⚠️ Pas de fichier 'resultats_global.csv'. Le pipeline s'arrête proprement."
          fi


      - name: Sauvegarde du rapport JUnit 
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-test-results
          path: report_*.xml
          retention-days: 5
      
     
      - name: Sauvegarde des rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/