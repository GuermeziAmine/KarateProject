name: Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        options:
          - preprod
          - staging
          - dev
        required: true
        default: 'preprod'

jobs:
  
  build:
    name: "Test - ${{ github.event.inputs.environment || 'preprod' }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4


      - name: Configuration du JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Log workflow inputs for Octane
        run: |
          echo "description::Environnement: ${{ github.event.inputs.environment || 'preprod' }}"

      - name: Start Checksum Node Server
        run: |
          cd checksum
          npm install
          node index.js &
          sleep 5

      - name: Run Karate Tests
        if: always()
        run: |
          TARGET_ENV="${{ github.event.inputs.environment || 'preprod' }}"
          mvn test -Dkarate.env=$TARGET_ENV "-Dkarate.options=classpath:Practice"

      
      - name: Convert durations
        if: always()
        run: |
          sed -i -E 's/time="([0-9]+)\.([0-9]+)"/time="\1\2"/g' target/surefire-reports/*.xml


      - name: Cache JMeter
        if: always()      
        id: cache-jmeter
        uses: actions/cache@v3
        with:
          path: jmeter
          key: jmeter-5.6.3

      - name: Install JMeter 5.6.3
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter
          rm apache-jmeter-5.6.3.tgz

      - name: Configuration de Python
        if: always()      
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installation de Taurus (bzt)
        if: always()
        run: |
          pip install bzt
          pip install urwid==2.1.2

      - name: Créer la configuration Taurus
        run: |
          cat <<EOF > octane_config.yml
          modules:
            jmeter:
              path: $PWD/jmeter/bin/jmeter
              save-xml-jtl: true   
          reporting:
          - module: junit-xml
            filename: report_octane.xml
            data-source: sample-labels
            sample-labels: true
          settings:
            check-updates: false
          EOF

      - name: Exécuter tous les tests du dossier
        run: |
          for file in src/test/jmeter/*.jmx; do
            echo "Exécution de $file..."
            FILENAME=$(basename "$file" .jmx)

            bzt "$file" octane_config.yml -q

            # 🔍 Trouver le fichier JTL généré
            JTL_FILE=$(find artifacts -name "*.jtl" | head -1)

            echo "Using JTL: $JTL_FILE"

            # 🧠 Extraire les temps (ms) depuis JTL
            TIMES=($(grep -o 't="[0-9]*"' "$JTL_FILE" | grep -o '[0-9]*'))

            INDEX=0

            # 🔧 Injecter dans le JUnit
            awk -v times="${TIMES[*]}" '
            BEGIN {
              split(times, arr, " ");
              i=1;
            }
            {
              if ($0 ~ /<testcase/ && $0 !~ /time=/) {
                sub(/<testcase/, "<testcase time=\"" arr[i++] "\"");
              }
              print;
            }' report_octane.xml > fixed.xml

            mv fixed.xml "report_${FILENAME}.xml"

            # nettoyer artifacts pour éviter mélange
            rm -rf artifacts/*
          done

      - name: Sauvegarde du rapport JUnit 
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-test-results
          path: report_*.xml
          retention-days: 5
      
     
      - name: Sauvegarde des rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/