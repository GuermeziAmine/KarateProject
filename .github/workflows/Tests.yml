name: Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        options:
          - preprod
          - staging
          - dev
        required: true
        default: 'preprod'

jobs:
  build:
    # On passe sur un serveur Windows pour tester une autre IP
    runs-on: windows-latest
    
    # --- AJOUT CRUCIAL ICI ---
    # On force Windows à utiliser un terminal "Bash" (façon Linux)
    # Sinon tes commandes (sleep, &, déclaration de variables) vont planter en PowerShell
    defaults:
      run:
        shell: bash
        
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration du JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Log workflow inputs for Octane
        run: |
          echo "execution_parameter:: {\"environment\":\"${{ github.event.inputs.environment || 'preprod' }}\"}"
          
      - name: Start Checksum Node Server
        run: |
          echo "Starting Node.js Checksum Server..."
          cd checksum
          npm install
          node index.js &
          sleep 5 
        
      - name: Run ONLY Dealer Locator Test
        if: always()
        run: |
          # --- CORRECTION ICI ---
          # Remise en place de la définition de la variable avant de l'utiliser
          TARGET_ENV="${{ github.event.inputs.environment || 'preprod' }}"
          echo "Running Dealer Locator Test on environment: $TARGET_ENV"
          
          # On utilise -Dkarate.options pour forcer l'exécution de ce seul fichier
          mvn clean test -Dkarate.env=$TARGET_ENV "-Dkarate.options=classpath:features/omni-DealerLocator.feature"

      - name: Sauvegarde des rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            target/karate-reports/
            target/surefire-reports/