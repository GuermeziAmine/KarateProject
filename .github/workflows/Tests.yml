name: Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        options:
          - preprod
          - staging
          - dev
        required: true
        default: 'preprod'

jobs:
  
  build:
    name: "Test - ${{ github.event.inputs.environment || 'preprod' }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du coder
        uses: actions/checkout@v4


      - name: Configuration du JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Log workflow inputs for Octane
        run: |
          echo "description::Environnement: ${{ github.event.inputs.environment || 'preprod' }}"

      - name: Start Checksum Node Server
        run: |
          cd checksum
          npm install
          node index.js &
          sleep 5

      - name: Run Karate Tests
        if: always()
        run: |
          TARGET_ENV="${{ github.event.inputs.environment || 'preprod' }}"
          mvn test -Dkarate.env=$TARGET_ENV "-Dkarate.options=classpath:Practice"

      
      - name: Convert durations
        if: always()
        run: |
          sed -i -E 's/time="([0-9]+)\.([0-9]+)"/time="\1\2"/g' target/surefire-reports/*.xml


      - name: Cache JMeter
        if: always()      
        id: cache-jmeter
        uses: actions/cache@v3
        with:
          path: jmeter
          key: jmeter-5.6.3

      - name: Install JMeter 5.6.3
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter
          rm apache-jmeter-5.6.3.tgz

      - name: Configuration de Python
        if: always()      
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installation de Taurus (bzt)
        if: always()
        run: |
          pip install bzt
          pip install urwid==2.1.2

      - name: 1. Exécution Hybride (Taurus -> Octane & Power BI)
        if: always()
        run: |
          # --- PRÉPARATION ---
          BASE_DIR="$PWD"
          OUTPUT_DIR="$BASE_DIR/results_powerbi"
          mkdir -p "$OUTPUT_DIR"
          
          echo "📂 Dossier cible final : $OUTPUT_DIR"

          # Configuration Taurus de base
          cat <<EOF > octane_config.yml
          modules:
            jmeter:
              path: $BASE_DIR/jmeter/bin/jmeter
          reporting:
          - module: junit-xml
            filename: report_octane.xml
            data-source: sample-labels
            sample-labels: true
          # On demande explicitement le CSV
          - module: final-stats
            dump-csv: kpi.jtl
          settings:
            check-updates: false
            default-executor: jmeter
          EOF

          # --- EXÉCUTION ---
          for file in src/test/jmeter/*.jmx; do
            echo "---------------------------------------------------"
            echo "🚀 Lancement de $file..."
            FILENAME=$(basename "$file" .jmx)
            
            # Dossier temporaire unique
            TEMP_DIR="temp_artifacts_$FILENAME"
            
            # CORRECTION : On utilise '-o settings.artifacts-dir=...' au lieu de '-d'
            bzt "$file" octane_config.yml -q \
              -o settings.artifacts-dir="$TEMP_DIR"

            # --- DIAGNOSTIC RAPIDE ---
            # Si ça échoue, on veut voir si le dossier a été créé
            if [ -d "$TEMP_DIR" ]; then
                echo "📂 Dossier temporaire créé : $TEMP_DIR"
            else
                echo "⚠️ Bizarre : Le dossier temporaire n'existe pas."
            fi

            # --- RECHERCHE INTELLIGENTE DU CSV ---
            # On cherche n'importe quel fichier CSV ou JTL dans ce dossier
            FOUND_FILE=$(find "$TEMP_DIR" -type f \( -name "*.jtl" -o -name "*.csv" \) | head -n 1)

            if [ -n "$FOUND_FILE" ]; then
                echo "✅ Bingo ! Fichier trouvé : $FOUND_FILE"
                cp "$FOUND_FILE" "$OUTPUT_DIR/${FILENAME}.csv"
                echo "➡️ Sauvegardé sous : $OUTPUT_DIR/${FILENAME}.csv"
            else
                echo "❌ ÉCHEC : Aucun fichier de résultat trouvé pour $FILENAME"
                # On liste tout pour comprendre (Debug ultime)
                echo "Contenu complet du répertoire courant :"
                ls -R | grep ".jtl" || echo "Aucun .jtl nulle part"
            fi

            # --- GESTION XML OCTANE ---
            FOUND_XML=$(find "$TEMP_DIR" -type f -name "report_octane.xml" | head -n 1)
            if [ -n "$FOUND_XML" ]; then
                sed -i -E "s/classname=\"bzt-[0-9]+\"/classname=\"$FILENAME\"/g" "$FOUND_XML"
                mv "$FOUND_XML" "report_${FILENAME}.xml"
            fi
            
            echo "---------------------------------------------------"
          done
          
          # Bilan final
          echo "🏁 Contenu de results_powerbi :"
          ls -lh "$OUTPUT_DIR"



      - name: Sauvegarde du rapport JUnit 
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-test-results
          path: report_*.xml
          retention-days: 5
      
     
      - name: Sauvegarde des rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/