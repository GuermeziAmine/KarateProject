name: Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        options:
          - preprod
          - staging
          - dev
        required: true
        default: 'preprod'

jobs:
  
  build:
    name: "Test - ${{ github.event.inputs.environment || 'preprod' }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4


      - name: Configuration du JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Log workflow inputs for Octane
        run: |
          echo "description::Environnement: ${{ github.event.inputs.environment || 'preprod' }}"

      - name: Start Checksum Node Server
        run: |
          cd checksum
          npm install
          node index.js &
          sleep 5

      - name: Run Karate Tests
        if: always()
        run: |
          TARGET_ENV="${{ github.event.inputs.environment || 'preprod' }}"
          mvn test -Dkarate.env=$TARGET_ENV "-Dkarate.options=classpath:Practice"

      
      - name: Convert durations
        if: always()
        run: |
          sed -i -E 's/time="([0-9]+)\.([0-9]+)"/time="\1\2"/g' target/surefire-reports/*.xml


      - name: Cache JMeter
        if: always()      
        id: cache-jmeter
        uses: actions/cache@v3
        with:
          path: jmeter
          key: jmeter-5.6.3

      - name: Install JMeter 5.6.3
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter
          rm apache-jmeter-5.6.3.tgz

      - name: Configuration de Python
        if: always()      
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installation de Taurus (bzt)
        if: always()
        run: |
          pip install bzt
          pip install urwid==2.1.2

      - name: Créer la configuration Taurus
        if: always()
        run: |
          cat <<EOF > octane_config.yml
          modules:
            jmeter:
              path: $PWD/jmeter/bin/jmeter
          reporting:
          - module: junit-xml
            filename: report_octane.xml
            data-source: sample-labels
            sample-labels: true
          settings:
            check-updates: false
          EOF

      - name: Créer le script d'injection de durée
        if: always()
        run: |
          cat <<'PYEOF' > inject_time.py
          import sys
          import csv
          import xml.etree.ElementTree as ET
          from collections import defaultdict

          jtl_path = sys.argv[1]
          xml_path = sys.argv[2]

          # Parse JTL: columns = timeStamp,elapsed,label,responseCode,...,success,...
          label_times = defaultdict(list)
          label_errors = defaultdict(int)

          with open(jtl_path, newline='', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              for row in reader:
                  label = row.get('label', '').strip()
                  elapsed = row.get('elapsed', '0').strip()
                  success = row.get('success', 'true').strip().lower()
                  if label:
                      try:
                          label_times[label].append(int(elapsed))
                      except ValueError:
                          pass
                      if success == 'false':
                          label_errors[label] += 1

          # Compute avg time in seconds per label
          label_avg = {
              label: round(sum(times) / len(times) / 1000, 6)
              for label, times in label_times.items()
              if times
          }

          # Update XML
          ET.register_namespace('', '')
          tree = ET.parse(xml_path)
          root = tree.getroot()

          total_time = 0.0
          total_tests = 0
          total_failures = 0

          for testsuite in root.iter('testsuite'):
              suite_time = 0.0
              suite_tests = 0
              suite_failures = 0
              for testcase in testsuite.iter('testcase'):
                  name = testcase.get('name', '')
                  avg = label_avg.get(name, 0.0)
                  testcase.set('time', str(avg))
                  suite_time += avg
                  suite_tests += 1
                  if testcase.find('failure') is not None or testcase.find('error') is not None:
                      suite_failures += 1
              testsuite.set('time', str(round(suite_time, 6)))
              testsuite.set('tests', str(suite_tests))
              testsuite.set('failures', str(suite_failures))
              total_time += suite_time
              total_tests += suite_tests
              total_failures += suite_failures

          root.set('time', str(round(total_time, 6)))
          root.set('tests', str(total_tests))
          root.set('failures', str(total_failures))

          tree.write(xml_path, encoding='unicode', xml_declaration=True)
          print(f"[inject_time] Done — {total_tests} tests, avg times injected from {jtl_path}")
          PYEOF

      - name: Exécuter tous les tests du dossier
        if: always()
        run: |
          for file in src/test/jmeter/*.jmx; do
            echo "Exécution de $file..."
            FILENAME=$(basename "$file" .jmx)

            # Run Taurus — artifacts (including results.xml JTL) land in /tmp/artifacts by default
            bzt "$file" octane_config.yml -q -o settings.artifacts-dir="artifacts_${FILENAME}"

            # Fix classname in JUnit XML
            sed -i -E "s/classname=\"bzt-[0-9]+\"/classname=\"$FILENAME\"/g" report_octane.xml

            # Find the JTL produced by this run (Taurus names it results.xml or kpi.jtl)
            JTL_FILE=$(find "artifacts_${FILENAME}" -name "*.jtl" -o -name "kpi.jtl" 2>/dev/null | head -1)

            if [ -n "$JTL_FILE" ]; then
              echo "Injection des durées depuis $JTL_FILE..."
              python inject_time.py "$JTL_FILE" report_octane.xml
            else
              echo "Avertissement: Pas de fichier JTL trouvé pour $FILENAME, durées = 0"
            fi

            mv report_octane.xml "report_${FILENAME}.xml"
          done

      - name: Sauvegarde du rapport JUnit 
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-test-results
          path: report_*.xml
          retention-days: 5
      
     
      - name: Sauvegarde des rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/