name: Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        options:
          - preprod
          - staging
          - dev
        required: true
        default: 'preprod'

jobs:
  
  build:
    name: "Test - ${{ github.event.inputs.environment || 'preprod' }}"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout du coder
        uses: actions/checkout@v4


      - name: Configuration du JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Log workflow inputs for Octane
        run: |
          echo "description::Environnement: ${{ github.event.inputs.environment || 'preprod' }}"

      - name: Start Checksum Node Server
        run: |
          cd checksum
          npm install
          node index.js &
          sleep 5

      - name: Run Karate Tests
        if: always()
        run: |
          TARGET_ENV="${{ github.event.inputs.environment || 'preprod' }}"
          mvn test -Dkarate.env=$TARGET_ENV "-Dkarate.options=classpath:Practice"

      
      - name: Convert durations
        if: always()
        run: |
          sed -i -E 's/time="([0-9]+)\.([0-9]+)"/time="\1\2"/g' target/surefire-reports/*.xml


      - name: Cache JMeter
        if: always()      
        id: cache-jmeter
        uses: actions/cache@v3
        with:
          path: jmeter
          key: jmeter-5.6.3

      - name: Install JMeter 5.6.3
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter
          rm apache-jmeter-5.6.3.tgz

      - name: Configuration de Python
        if: always()      
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installation de Taurus (bzt)
        if: always()
        run: |
          pip install bzt
          pip install urwid==2.1.2

      - name: 1. Exécution Hybride (Taurus -> Octane & Power BI)
        if: always()
        run: |
          # --- PRÉPARATION ---
          BASE_DIR="$PWD"
          OUTPUT_DIR="$BASE_DIR/results_powerbi"
          mkdir -p "$OUTPUT_DIR"
          
          echo "📂 Dossier cible final : $OUTPUT_DIR"

          # Configuration Taurus
          cat <<EOF > octane_config.yml
          modules:
            jmeter:
              path: $BASE_DIR/jmeter/bin/jmeter
          reporting:
          - module: junit-xml
            filename: report_octane.xml
            data-source: sample-labels
            sample-labels: true
          - module: final-stats
            dump-csv: kpi.jtl
          settings:
            check-updates: false
            default-executor: jmeter
          EOF

          # --- BOUCLE DES TESTS ---
          for file in src/test/jmeter/*.jmx; do
            echo "======================================================="
            echo "🚀 Traitement du test : $file"
            FILENAME=$(basename "$file" .jmx)
            TEMP_DIR="artifacts_$FILENAME"
            
            # Lancement Taurus
            bzt "$file" octane_config.yml -q \
              -o settings.artifacts-dir="$TEMP_DIR"

            # ---------------------------------------------------------
            # PARTIE 1 : SAUVETAGE DU CSV (Power BI)
            # ---------------------------------------------------------
            if [ -f "$TEMP_DIR/kpi.jtl" ]; then
                cp "$TEMP_DIR/kpi.jtl" "$OUTPUT_DIR/${FILENAME}.csv"
                echo "✅ CSV Power BI sauvegardé."
            else
                # Recherche de secours
                FOUND_CSV=$(find "$TEMP_DIR" -name "*.csv" | head -n 1)
                if [ -n "$FOUND_CSV" ]; then
                   cp "$FOUND_CSV" "$OUTPUT_DIR/${FILENAME}.csv"
                   echo "✅ CSV alternatif trouvé et copié."
                else
                   echo "⚠️ Aucun CSV trouvé pour ce test."
                fi
            fi

            # ---------------------------------------------------------
            # PARTIE 2 : RÉPARATION DU XML (Octane) - CORRIGÉ
            # ---------------------------------------------------------
            # On cible précisément le fichier généré dans le dossier temporaire
            SOURCE_XML="$TEMP_DIR/report_octane.xml"
            DEST_XML="report_${FILENAME}.xml"
            
            if [ -f "$SOURCE_XML" ]; then
                echo "🔧 Traitement du XML Octane..."
                
                # 1. Remplacement du nom de classe (Regex Universel)
                # On remplace 'classname="bzt-nimportequoi"' par 'classname="NomDuFichier"'
                # Le sed utilise maintenant [^\"]* pour capturer tout ce qui est entre guillemets
                sed -i -E "s/classname=\"bzt-[^\"]*\"/classname=\"$FILENAME\"/g" "$SOURCE_XML"
                
                # 2. Déplacement vers la racine (pour que le plugin Octane le trouve)
                mv "$SOURCE_XML" "$DEST_XML"
                
                echo "✅ XML corrigé et déplacé vers : $DEST_XML"
                
                # Debug : Afficher les 3 premières lignes pour vérifier le changement
                head -n 3 "$DEST_XML"
            else
                echo "❌ CRITIQUE : Pas de report_octane.xml généré dans $TEMP_DIR"
            fi
            
            echo "======================================================="
          done
          
          # Vérification finale : Lister tous les rapports XML générés à la racine
          echo "📊 Bilan des rapports XML prêts pour Octane :"
          ls -l report_*.xml



      - name: 2. Fusionner les CSV pour Power BI
        if: always()
        run: |
          # Création explicite du dossier final
          mkdir -p final_results
          
          # On cherche les fichiers avec le chemin absolu
          FIRST_FILE=$(ls results_powerbi/*.csv 2>/dev/null | head -n 1)
          
          if [ -n "$FIRST_FILE" ]; then
            echo "✅ Fichiers trouvés. Début de la fusion..."
            head -n 1 "$FIRST_FILE" > final_results/resultats_global.csv
            tail -n +2 -q results_powerbi/*.csv >> final_results/resultats_global.csv
          else
            echo "⚠️ Aucun fichier CSV trouvé. Vérifiez l'étape précédente."
          fi

      - name: 3. Mise à jour de l'Historique (Mode Append)
        if: always()
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Chemins
          mkdir -p history
          HISTORY_FILE="history/global_perf_history.csv"
          NEW_DATA="final_results/resultats_global.csv"
          
          # --- SÉCURITÉ : On vérifie si le fichier existe avant de toucher ---
          if [ -f "$NEW_DATA" ]; then
            echo "✅ Nouvelles données détectées. Traitement en cours..."
            
            # Ajouter le Run ID
            sed -i "s/$/,$GITHUB_RUN_NUMBER/" "$NEW_DATA"
            
            # Logique d'ajout
            if [ ! -f "$HISTORY_FILE" ]; then
                echo "Création du fichier historique..."
                sed "1s/$GITHUB_RUN_NUMBER/RunID/" "$NEW_DATA" > "$HISTORY_FILE"
            else
                echo "Ajout au fichier existant..."
                tail -n +2 "$NEW_DATA" >> "$HISTORY_FILE"
            fi

            # Commit
            git add "$HISTORY_FILE"
            git diff --quiet && git diff --staged --quiet || (git commit -m "Append Run $GITHUB_RUN_NUMBER to History [skip ci]" && git push)
          
          else
            echo "⚠️ Pas de fichier 'resultats_global.csv'. Le pipeline s'arrête proprement."
          fi


      - name: Sauvegarde du rapport JUnit 
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-test-results
          path: report_*.xml
          retention-days: 5
      
     
      - name: Sauvegarde des rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/