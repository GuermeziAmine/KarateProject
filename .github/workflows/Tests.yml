name: Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        options:
          - preprod
          - staging
          - dev
        required: true
        default: 'preprod'

jobs:
  build:
    runs-on: ubuntu-latest
    

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration du JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      - name: Log workflow inputs for Octane
        run: |
          echo "execution_parameter:: {\"environment\":\"${{ github.event.inputs.environment || 'preprod' }}\"}"

          
      - name: Start Checksum Node Server
        run: |
          echo "Starting Node.js Checksum Server..."
          cd checksum
          npm install
          node index.js &
          sleep 5 

        
      - name: Run Karate API Tests 
        if: always()
        run: |
          echo "Running Karate Tests on environment: ${{ github.event.inputs.environment || 'preprod' }}"
          mvn clean test -Dkarate.env=${{ github.event.inputs.environment || 'preprod' }}


    
      

      - name: Sauvegarde des rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
      
      - name: Upload Karate Results to OneDrive via Microsoft Graph
        if: always()
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          USER_EMAIL: "minouguermezi170@gmail.com" # ⚠️ À remplacer par votre adresse mail OneDrive
        run: |
          # 1. Définition du fichier cible (pas de ZIP)
          FILE_PATH="target/karate-reports/karate-summary-json.txt"
          FILE_NAME="karate-summary-json.txt"
          
          # Vérification que le fichier existe bien avant d'envoyer
          if [ ! -f "$FILE_PATH" ]; then
            echo "Le fichier de rapport n'existe pas : $FILE_PATH"
            exit 1
          fi

          # 2. Récupération du jeton (Correction de l'URL et du scope)
          echo "Demande du jeton d'accès..."
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT_ID/oauth2/v2.0/token" \
            -d "client_id=$CLIENT_ID" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "grant_type=client_credentials" | jq -r .access_token)

          if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
            echo "Erreur : Impossible de récupérer le jeton d'accès."
            exit 1
          fi

          # 3. Envoi vers OneDrive (Correction de l'URL vers Microsoft Graph API)
          echo "Envoi du fichier vers OneDrive..."
          curl -s -X PUT "https://graph.microsoft.com/v1.0/users/$USER_EMAIL/drive/root:/PFE_Results/$FILE_NAME:/content" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: text/plain" \
            --data-binary @"$FILE_PATH"
            
          echo -e "\nUpload terminé !"










