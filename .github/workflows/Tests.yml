name: Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        options:
          - preprod
          - staging
          - dev
        required: true
        default: 'preprod'

jobs: 
  
  build:
    name: "Test - ${{ github.event.inputs.environment || 'preprod' }}"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout du coder
        uses: actions/checkout@v4


      - name: Configuration du JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Log workflow inputs for Octane
        run: |
          echo "description::Environnement: ${{ github.event.inputs.environment || 'preprod' }}"

      - name: Start Checksum Node Server
        run: |
          cd checksum
          npm install
          node index.js &
          sleep 5

      - name: Run Karate Tests
        if: always()
        run: |
          TARGET_ENV="${{ github.event.inputs.environment || 'preprod' }}"
          mvn clean test -Dkarate.env=$TARGET_ENV "-Dkarate.options=classpath:features"

      
      - name: Convert durations
        if: always()
        run: |
          sed -i -E 's/time="([0-9]+)\.([0-9]+)"/time="\1\2"/g' target/surefire-reports/*.xml 


      - name: Cache JMeter
        if: always()      
        id: cache-jmeter
        uses: actions/cache@v3
        with:
          path: jmeter
          key: jmeter-5.6.3

      - name: Install JMeter 5.6.3
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter
          rm apache-jmeter-5.6.3.tgz

      - name: Configuration de Python
        if: always()      
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installation de Taurus (bzt)
        if: always()
        run: |
          pip install bzt
          pip install urwid==2.1.2

      - name: Exécution des tests de performance
        if: always()
        run: |
          BASE_DIR="$PWD"
          mkdir -p results_powerbi

          cat <<EOF > octane_config.yml
          modules:
            jmeter:
              path: $BASE_DIR/jmeter/bin/jmeter
          reporting:
          - module: junit-xml
            filename: report_octane.xml
            data-source: sample-labels
            sample-labels: true
          settings:
            check-updates: false
          EOF

          for file in src/test/jmeter/*.jmx; do
            FILENAME=$(basename "$file" .jmx)
            TEMP_DIR="artifacts_$FILENAME"

            bzt "$file" octane_config.yml -q -o settings.artifacts-dir="$TEMP_DIR"

            # XML
            sed -i -E "s/classname=\"bzt-[^\"]+\"/classname=\"$FILENAME\"/g" report_octane.xml
            mv report_octane.xml "report_${FILENAME}.xml"

            # CSV Power BI
            [ -f "$TEMP_DIR/kpi.jtl" ] && cp "$TEMP_DIR/kpi.jtl" "results_powerbi/${FILENAME}.csv"
          done

      - name: Fusionner les CSV pour Power BI
        if: always()
        run: |
          mkdir -p final_results
          FIRST=$(ls results_powerbi/*.csv 2>/dev/null | head -1)
          if [ -n "$FIRST" ]; then
            head -1 "$FIRST" > final_results/resultats_global.csv
            tail -n +2 -q results_powerbi/*.csv >> final_results/resultats_global.csv
          fi

      - name: Mise à jour de l'historique
        if: always()
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          mkdir -p history
          HISTORY_FILE="history/global_perf_history.csv"
          NEW_DATA="final_results/resultats_global.csv"

          [ ! -f "$NEW_DATA" ] && exit 0

          sed -i "s/$/,$GITHUB_RUN_NUMBER/" "$NEW_DATA"

          if [ ! -f "$HISTORY_FILE" ]; then
            sed "1s/,$GITHUB_RUN_NUMBER/,RunID/" "$NEW_DATA" > "$HISTORY_FILE"
          else
            tail -n +2 "$NEW_DATA" >> "$HISTORY_FILE"
          fi

          git add "$HISTORY_FILE"
          git diff --staged --quiet || git commit -m "Append Run $GITHUB_RUN_NUMBER [skip ci]" && git push


      - name: Sauvegarde du rapport JUnit 
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-test-results
          path: report_*.xml
          retention-days: 5
      
     
      - name: Sauvegarde des rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/