name: Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        type: choice
        options:
          - preprod
          - staging
          - dev
        required: true
        default: 'preprod'

jobs:
  build:
    runs-on: ubuntu-latest
    

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration du JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      - name: Log workflow inputs for Octane
        run: |
          echo "execution_parameter:: {\"environment\":\"${{ github.event.inputs.environment || 'preprod' }}\"}"

          
      - name: Start Checksum Node Server
        run: |
          echo "Starting Node.js Checksum Server..."
          cd checksum
          npm install
          node index.js &
          sleep 5 

        
      - name: Run Karate API Tests 
        if: always()
        run: |
          echo "Running Karate Tests on environment: ${{ github.event.inputs.environment || 'preprod' }}"
          mvn clean test -Dkarate.env=${{ github.event.inputs.environment || 'preprod' }}


    
      

      - name: Sauvegarde des rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
      
      - name: Upload Karate Results to OneDrive
        if: always()
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          # 1. Créer le ZIP
          zip -r karate-results.zip target/karate-reports/*.karate-json.txt

          # 2. Récupération du jeton (Notez bien le 'login.' au début)
          TOKEN=$(curl -X POST "https://login.microsoftonline.com/$TENANT_ID/oauth2/v2.0/token" \
            -d "client_id=$CLIENT_ID" \
            -d "scope=https://microsoft.com" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "grant_type=client_credentials" | jq -r .access_token)

          # 3. Envoi vers OneDrive (Utilisation de /users/ID_OU_MAIL)
          curl -X PUT "https://microsoft.com" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @"karate-results.zip"










